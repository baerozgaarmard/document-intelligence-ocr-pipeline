[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "document-intelligence-ocr-pipeline"
version = "0.1.0"
description = "Robust PDF ingestion pipeline converting text and scanned documents into structured, validated JSON."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Ayush Bhatt", email = "88306520+baerozgaarmard@users.noreply.github.com" }
]
dependencies = [
    "pymupdf>=1.24.0",
    "pillow>=10.0.0",
    "pytesseract>=0.3.10",
    "pydantic>=2.7.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "python-multipart>=0.0.9",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[project.scripts]
docintel = "docintel.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
